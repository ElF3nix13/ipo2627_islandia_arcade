<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" type="module"></script>
</head>

<body>
    <main class="contenedor-principal">
        <!-- PANTALLA INICIAL (Menú, Ajustes y Ayuda) -->
        <section data-pantalla="inicio" class="pantalla pantalla--activa">
            <div class="caja-menu">
                <h1 class="titulo-juego">BREAKOUT</h1>
                
                <!-- Menú Principal -->
                <div data-menu="principal" class="menu-bloque">
                    <button data-action="jugar" class="btn btn--primario btn--grande">Jugar</button>
                    <div class="menu-bloque__secundario"> 
                        <button data-action="abrir-ajustes" class="btn btn--secundario btn--mediano">Ajustes</button>
                        <button data-action="abrir-ayuda" class="btn btn--secundario btn--mediano" aria-label="Ayuda">Cómo Jugar</button>
                    </div>
                </div>

                <!-- Menú de Ajustes -->
                <div data-menu="ajustes" class="menu-bloque oculto">
                    <div class="ajuste-grupo">
                        <label>Tamaño de la Paleta</label>
                        <div class="control-segmentado" data-setting-group="paleta">
                            <button class="control-segmentado__btn" data-val="pequena">Pequeña</button>
                            <button class="control-segmentado__btn control-segmentado__btn--activo" data-val="mediana">Mediana</button>
                            <button class="control-segmentado__btn" data-val="grande">Grande</button>
                        </div>
                    </div>

                    <div class="ajuste-grupo">
                        <label>Velocidad de la Bola</label>
                        <div class="control-segmentado" data-setting-group="velocidad">
                            <button class="control-segmentado__btn" data-val="lenta">Lenta</button>
                            <button class="control-segmentado__btn control-segmentado__btn--activo" data-val="normal">Normal</button>
                            <button class="control-segmentado__btn" data-val="rapida">Rápida</button>
                        </div>
                    </div>

                    <div class="ajuste-grupo">
                        <label>Filas de Ladrillos: <span data-bind="valor-filas">4</span></label>
                        <input type="range" data-setting="filas" min="2" max="8" value="4">
                    </div>

                    <button data-action="guardar-ajustes" class="btn btn--primario btn--mediano btn--menu">Guardar</button>
                </div>

                <!-- Menú de Ayuda -->
                <div data-menu="ayuda" class="menu-bloque oculto">
                    <h2 class="subtitulo">Cómo Jugar</h2>
                    <div class="guia-pasos">
                        <div class="guia-pasos__item">
                            <span class="guia-pasos__icono-box">
                                <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="8 8 4 12 8 16"/><polyline points="16 8 20 12 16 16"/></svg>
                            </span>
                            <div>
                                <strong>Mover la paleta</strong>
                                <p>Desplaza el ratón de un lado a otro</p>
                            </div>
                        </div>
                        <div class="guia-pasos__item">
                            <span class="guia-pasos__icono-box">
                                <img src="img/click.svg" class="icono" alt="" aria-hidden="true">
                            </span>
                            <div>
                                <strong>Lanzar la bola</strong>
                                <p>Haz clic para iniciar o tras perder una vida</p>
                            </div>
                        </div>
                        <div class="guia-pasos__item">
                            <span class="guia-pasos__icono-box">
                                <img src="img/corazon.svg" class="icono icono--corazon" alt="" aria-hidden="true">
                            </span>
                            <div>
                                <strong>Objetivo</strong>
                                <p>Destruye los ladrillos sin perder las 3 vidas</p>
                            </div>
                        </div>
                    </div>
                    <button data-action="cerrar-ayuda" class="btn btn--primario btn--mediano btn--menu">Entendido</button>
                </div>
            </div>
        </section>

        <!-- PANTALLA DE JUEGO -->
        <section data-pantalla="juego" class="pantalla oculto">
            <div class="hud">
                <div class="hud__stats">
                    <div data-hud="vidas" class="hud__vidas" aria-label="3 vidas restantes">
                        <img src="img/corazon.svg" class="icono icono--corazon" alt="" aria-hidden="true">
                        <img src="img/corazon.svg" class="icono icono--corazon" alt="" aria-hidden="true">
                        <img src="img/corazon.svg" class="icono icono--corazon" alt="" aria-hidden="true">
                    </div>
                    <div class="hud__tiempo">
                        <img src="img/reloj.svg" class="icono" alt="" aria-hidden="true">
                        <span><span data-bind="tiempo">0</span>s</span>
                    </div>
                </div>
                <button data-action="pausar" class="btn btn--secundario btn--icono" aria-label="Pausar Partida">
                    <svg class="icono" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
                </button>
            </div>
            <div class="canvas-contenedor">
                <canvas data-canvas="juego" width="800" height="500"></canvas>
            </div>
        </section>

        <!-- PANTALLA DE FIN -->
        <section data-pantalla="fin" class="pantalla oculto">
            <div class="caja-menu">
                <h2 class="titulo-fin" data-bind="titulo-fin">Fin</h2>
                <p class="resultado-tiempo">Tiempo total: <strong data-bind="tiempo-final">0</strong>s</p>
                
                <div class="menu-bloque">
                    <button data-action="nueva-partida" class="btn btn--primario btn--grande">Nueva Partida</button>
                    <button data-action="volver-menu" class="btn btn--secundario btn--mediano">Volver al Menú</button>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL NATIVO (Únicamente para la Pausa) -->
    <dialog data-modal="pausa" class="modal">
        <div class="modal__contenido">
            <h2 class="subtitulo">Juego Pausado</h2>
            <button data-action="continuar" class="btn btn--primario btn--mediano">Continuar</button>
            <button data-action="salir" class="btn btn--secundario btn--mediano">Salir al Menú</button>
        </div>
    </dialog>
</body>

</html>
